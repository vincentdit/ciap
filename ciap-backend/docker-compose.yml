services:
  mysql:
    image: mysql:8.0
    container_name: ciap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ciap
      MYSQL_USER: ciap_app
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - ciap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ciap_mysql_data:
