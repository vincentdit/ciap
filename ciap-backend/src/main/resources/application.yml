spring:
  application:
    name: ciap-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ciap}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Dar_es_Salaam
    username: ${DB_USER:ciap_app}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Dar_es_Salaam
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-stacktrace: never

# Application-specific configuration
ciap:
  storage:
    # Where uploaded document files are written. Override in production with a
    # backed-up, writable path (e.g. /var/lib/ciap/documents).
    root: ${CIAP_STORAGE_ROOT:ciap-documents}
  security:
    jwt:
      # Base64-encoded 256-bit secret. OVERRIDE in production via CIAP_JWT_SECRET.
      secret: ${CIAP_JWT_SECRET:Y2lhcC10aXJkby1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
      access-token-ttl-minutes: 30
      refresh-token-ttl-days: 7
      issuer: ciap.tirdo.go.tz

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    tz.go.tirdo.ciap: INFO
    org.springframework.security: WARN
